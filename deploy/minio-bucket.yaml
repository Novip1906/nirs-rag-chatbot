apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-bucket
  namespace: corporate
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-08-13T08-35-41Z
          env:
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: accessKey
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secretKey
          command:
            - sh
            - -c
            - |
              until mc alias set local http://minio:9000 "$ACCESS_KEY" "$SECRET_KEY" >/dev/null 2>&1; do
                echo "waiting for MinIO..."
                sleep 3
              done
              mc mb --ignore-existing local/knowledge
              mc ls local
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
