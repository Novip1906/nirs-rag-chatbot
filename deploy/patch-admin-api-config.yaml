apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-api
  namespace: corporate
data:
  KEYCLOAK_ISSUER: "https://auth.example.com/realms/corporate"
  KEYCLOAK_JWKS_URL: "http://keycloak/realms/corporate/protocol/openid-connect/certs"
  KEYCLOAK_ADMIN_URL: "http://keycloak"
  NOTIFY_URLS: "http://librechat/api/admin-api/notify"
  PUBLIC_BASE_URL: "https://admin.example.com/api"
  INVITE_CLIENT_ID: "librechat"
  INVITE_REDIRECT_URL: "https://ai.example.com/login"
