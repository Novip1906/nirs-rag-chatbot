apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embeddings-cache
  namespace: corporate
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: embeddings
  namespace: corporate
spec:
  selector:
    app: embeddings
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embeddings
  namespace: corporate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: embeddings
  template:
    metadata:
      labels:
        app: embeddings
    spec:
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
          args:
            - --model-id=BAAI/bge-m3
            - --port=8080
            - --max-batch-tokens=2048
            - --max-client-batch-size=16
            - --auto-truncate
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: cache
              mountPath: /data
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "6Gi"
              cpu: "6"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: embeddings-cache
