apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: corporate
  namespace: corporate
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: "60m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ai.example.com
        - admin.example.com
        - auth.example.com
      secretName: corporate-tls
  rules:
    - host: ai.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: librechat
                port:
                  number: 80
    - host: admin.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adminui
                port:
                  number: 80
    - host: auth.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-api
  namespace: corporate
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "6m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - admin.example.com
      secretName: corporate-tls
  rules:
    - host: admin.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: admin-api
                port:
                  number: 8091
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: corporate-password-reset
  namespace: corporate
  annotations:
    nginx.ingress.kubernetes.io/limit-rpm: "10"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "1"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - auth.example.com
      secretName: corporate-tls
  rules:
    - host: auth.example.com
      http:
        paths:
          - path: /realms/corporate/login-actions/reset-credentials
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 80
