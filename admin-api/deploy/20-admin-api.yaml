apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-api
  namespace: corporate
data:
  HTTP_ADDR: ":8091"
  HTTP_PATH_PREFIX: "/api"
  KEYCLOAK_AUDIENCE: "admin-api"
  KEYCLOAK_REALM: "corporate"
  KEYCLOAK_ADMIN_CLIENT_ID: "admin-api"
  READER_CLIENTS: "ai-admin-api"
  ADMIN_CLIENTS: "admin"
  NOTIFY_CLIENT_ID: "admin-api-notify"
  RECONCILE_INTERVAL: "5m"
  RECONCILE_MAX_DISABLES: "5"
  RECONCILE_MAX_ENABLES: "5"
  INVITE_TTL: "168h"
  ACTIVATION_INTERVAL: "30s"
---
apiVersion: v1
kind: Service
metadata:
  name: admin-api
  namespace: corporate
spec:
  selector:
    app: admin-api
  ports:
    - port: 8091
      targetPort: 8091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
  namespace: corporate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: admin-api
  template:
    metadata:
      labels:
        app: admin-api
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/novip1906/corporate-admin-api:latest
          args: ["migrate"]
          env:
            - name: ADMIN_API_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-api
                  key: db_password
            - name: POSTGRES_DSN
              value: "postgres://admin_api:$(ADMIN_API_DB_PASSWORD)@admin-api-db:5432/admin_api?sslmode=disable"
      containers:
        - name: admin-api
          image: ghcr.io/novip1906/corporate-admin-api:latest
          args: ["serve"]
          envFrom:
            - configMapRef:
                name: admin-api
          env:
            - name: GOMEMLIMIT
              value: "300MiB"
            - name: ADMIN_API_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-api
                  key: db_password
            - name: POSTGRES_DSN
              value: "postgres://admin_api:$(ADMIN_API_DB_PASSWORD)@admin-api-db:5432/admin_api?sslmode=disable"
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: admin-api
                  key: keycloak_admin_client_secret
            - name: NOTIFY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: admin-api
                  key: notify_client_secret
          ports:
            - containerPort: 8091
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "384Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8091
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8091
            periodSeconds: 20
            failureThreshold: 3
