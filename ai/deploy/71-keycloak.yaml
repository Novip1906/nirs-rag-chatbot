apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: corporate
spec:
  selector:
    app: keycloak
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
data:
  error.ftl: |
    <#import "template.ftl" as layout>
    <@layout.registrationLayout displayMessage=false; section>
        <#if section = "header">
            ${kcSanitize(msg("errorTitle"))?no_esc}
        <#elseif section = "form">
            <p class="nf-instruction">${kcSanitize(message.summary)?no_esc}</p>
            <#if traceId??>
                <p class="nf-trace-id">${msg("traceIdSupportMessage", traceId)}</p>
            </#if>
            <#if !skipLink?? && client?? && client.baseUrl?has_content>
                <div class="nf-back-link">
                    <a id="backToApplication" href="${client.baseUrl}">${msg("backToApplication")}</a>
                </div>
            </#if>
        </#if>
    </@layout.registrationLayout>
  info.ftl: |
    <#import "template.ftl" as layout>
    <@layout.registrationLayout displayMessage=false; section>
        <#if section = "header">
            <#if messageHeader??>${kcSanitize(msg("${messageHeader}"))?no_esc}<#else>${message.summary}</#if>
        <#elseif section = "form">
            <#if messageHeader?? || requiredActions??>
                <p class="nf-instruction">${message.summary}<#if requiredActions??><#list requiredActions>: <b><#items as reqActionItem>${kcSanitize(msg("requiredAction.${reqActionItem}"))?no_esc}<#sep>, </#items></b></#list></#if></p>
            </#if>
            <#if !skipLink??>
                <#if pageRedirectUri?has_content>
                    <div class="nf-back-link">
                        <a id="backToApplication" href="${pageRedirectUri}">${msg("backToApplication")}</a>
                    </div>
                <#elseif actionUri?has_content>
                    <div class="nf-back-link">
                        <a href="${actionUri}">${msg("proceedWithAction")}</a>
                    </div>
                <#elseif (client.baseUrl)?has_content>
                    <div class="nf-back-link">
                        <a id="backToApplication" href="${client.baseUrl}">${msg("backToApplication")}</a>
                    </div>
                </#if>
            </#if>
        </#if>
    </@layout.registrationLayout>
  login-page-expired.ftl: |
    <#import "template.ftl" as layout>
    <@layout.registrationLayout; section>
        <#if section = "header">
            ${msg("pageExpiredTitle")}
        <#elseif section = "form">
            <p class="nf-instruction">
                ${msg("pageExpiredMsg1")} <a id="loginRestartLink" href="${url.loginRestartFlowUrl}">${msg("doClickHere")}</a>.<br/>
                ${msg("pageExpiredMsg2")} <a id="loginContinueLink" href="${url.loginAction}">${msg("doClickHere")}</a>.
            </p>
        </#if>
    </@layout.registrationLayout>
  login-reset-password.ftl: |
    <#import "template.ftl" as layout>
    <@layout.registrationLayout displayMessage=!messagesPerField.existsError('username'); section>
        <#if section = "header">
            ${msg("emailForgotTitle")}
        <#elseif section = "form">
            <p class="nf-instruction">${msg("emailInstruction")}</p>
            <form id="kc-reset-password-form" class="nf-form" action="${url.loginAction}" method="post">
                <div class="nf-field">
                    <input type="text" id="username" name="username" class="nf-input" autofocus value="${(auth.attemptedUsername)!''}" placeholder=" "
                           aria-invalid="<#if messagesPerField.existsError('username')>true</#if>" />
                    <label for="username" class="nf-label">
                        <#if !realm.loginWithEmailAllowed>${msg("username")}<#elseif !realm.registrationEmailAsUsername>${msg("usernameOrEmail")}<#else>${msg("email")}</#if>
                    </label>
                </div>

                <#if messagesPerField.existsError('username')>
                    <span class="nf-field-error">${kcSanitize(messagesPerField.get('username'))?no_esc}</span>
                </#if>

                <div class="nf-submit">
                    <input class="nf-button" type="submit" value="${msg("doSubmit")}"/>
                </div>
            </form>
            <div class="nf-back-link">
                <a href="${url.loginUrl}">${msg("backToLogin")}</a>
            </div>
        </#if>
    </@layout.registrationLayout>
  login-update-password.ftl: |
    <#import "template.ftl" as layout>
    <@layout.registrationLayout displayMessage=!messagesPerField.existsError('password','password-confirm'); section>
        <#if section = "header">
            ${msg("updatePasswordTitle")}
        <#elseif section = "form">
            <form id="kc-passwd-update-form" class="nf-form" onsubmit="login.disabled = true; return true;" action="${url.loginAction}" method="post">
                <div class="nf-field nf-field-password">
                    <input type="password" id="password-new" name="password-new" class="nf-input" autofocus autocomplete="new-password" placeholder=" "
                           aria-invalid="<#if messagesPerField.existsError('password','password-confirm')>true</#if>" />
                    <label for="password-new" class="nf-label">${msg("passwordNew")}</label>
                    <button type="button" class="nf-password-toggle" aria-label="${msg("showPassword")}" onclick="nfTogglePassword(this)">
                        <svg class="nf-eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="nf-eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>

                <#if messagesPerField.existsError('password')>
                    <span class="nf-field-error">${kcSanitize(messagesPerField.get('password'))?no_esc}</span>
                </#if>

                <div class="nf-field nf-field-password">
                    <input type="password" id="password-confirm" name="password-confirm" class="nf-input" autocomplete="new-password" placeholder=" "
                           aria-invalid="<#if messagesPerField.existsError('password-confirm')>true</#if>" />
                    <label for="password-confirm" class="nf-label">${msg("passwordConfirm")}</label>
                    <button type="button" class="nf-password-toggle" aria-label="${msg("showPassword")}" onclick="nfTogglePassword(this)">
                        <svg class="nf-eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="nf-eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>

                <#if messagesPerField.existsError('password-confirm')>
                    <span class="nf-field-error">${kcSanitize(messagesPerField.get('password-confirm'))?no_esc}</span>
                </#if>

                <input type="hidden" name="logout-sessions" value="on"/>

                <#if isAppInitiatedAction??>
                    <div class="nf-submit-row">
                        <input class="nf-button" type="submit" name="login" value="${msg("doSubmit")}"/>
                        <button class="nf-button nf-button-secondary" type="submit" name="cancel-aia" value="true">${msg("doCancel")}</button>
                    </div>
                <#else>
                    <div class="nf-submit">
                        <input class="nf-button" type="submit" name="login" value="${msg("doSubmit")}"/>
                    </div>
                </#if>
            </form>
        </#if>
    </@layout.registrationLayout>
  login.css: |
    :root {
      --nf-bg: #ffffff;
      --nf-surface: #ffffff;
      --nf-text: #212121;
      --nf-text-secondary: #424242;
      --nf-text-secondary-alt: #595959;
      --nf-border: #e3e3e3;
      --nf-accent: #126e6b;
      --nf-accent-hover: #0a4f53;
      --nf-error: #b91c1c;
      --nf-font: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --nf-bg: #0d0d0d;
        --nf-surface: #0d0d0d;
        --nf-text: #ececec;
        --nf-text-secondary: #cdcdcd;
        --nf-text-secondary-alt: #999696;
        --nf-border: #2f2f2f;
        --nf-accent: #41a79d;
        --nf-accent-hover: #6dc8b9;
        --nf-error: #f87171;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body.nf-body {
      font-family: var(--nf-font);
      background: var(--nf-bg);
      color: var(--nf-text);
    }

    .nf-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--nf-bg);
    }

    .nf-logo {
      margin-top: 2.5rem;
      margin-bottom: 1rem;
    }

    .nf-logo img {
      height: 42px;
      width: auto;
      display: block;
    }

    .nf-alert {
      margin: 0 1rem 1rem;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      max-width: 370px;
      width: 100%;
    }

    .nf-card .nf-alert {
      margin: 0 0 1.25rem;
      max-width: none;
    }

    .nf-alert-error {
      background: rgba(185, 28, 28, 0.08);
      color: var(--nf-error);
      border: 1px solid rgba(185, 28, 28, 0.3);
    }

    .nf-alert-success {
      background: rgba(18, 110, 107, 0.08);
      color: var(--nf-accent);
      border: 1px solid rgba(18, 110, 107, 0.3);
    }

    .nf-alert-warning,
    .nf-alert-info {
      background: rgba(66, 66, 66, 0.06);
      color: var(--nf-text-secondary);
      border: 1px solid var(--nf-border);
    }

    .nf-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 1rem;
    }

    .nf-card {
      width: 100%;
      max-width: 370px;
    }

    .nf-title {
      margin: 0 0 1.5rem;
      text-align: center;
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--nf-text);
      user-select: none;
    }

    .nf-form {
      margin-top: 0;
    }

    .nf-field {
      position: relative;
      margin-bottom: 1rem;
    }

    .nf-field-password {
      margin-bottom: 0.5rem;
    }

    .nf-input {
      width: 100%;
      height: auto;
      box-sizing: border-box;
      padding: 1.125rem 0.875rem 0.625rem;
      border-radius: 1rem;
      border: 1px solid var(--nf-border);
      background: var(--nf-surface);
      color: var(--nf-text);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .nf-field-password .nf-input {
      padding-right: 3rem;
    }

    .nf-input::placeholder {
      color: transparent;
    }

    .nf-input:hover {
      border-color: var(--nf-border);
    }

    .nf-input:focus {
      border-color: var(--nf-accent);
    }

    .nf-input[aria-invalid='true'] {
      border-color: var(--nf-error);
    }

    .nf-label {
      position: absolute;
      left: 0.75rem;
      top: 0.375rem;
      transform: translateY(0) scale(0.75);
      transform-origin: 0 0;
      font-size: 1rem;
      color: var(--nf-text-secondary-alt);
      background: var(--nf-surface);
      padding: 0 0.5rem;
      transition: all 0.2s;
      pointer-events: none;
    }

    .nf-input:placeholder-shown + .nf-label {
      top: 50%;
      transform: translateY(-50%) scale(1);
    }

    .nf-input:focus + .nf-label {
      top: 0.375rem;
      transform: translateY(0) scale(0.75);
      color: var(--nf-accent);
    }

    .nf-password-toggle {
      position: absolute;
      right: 0.5rem;
      top: 0;
      bottom: 0;
      margin: auto 0;
      height: 2.25rem;
      width: 2.25rem;
      border: none;
      background: transparent;
      border-radius: 0.75rem;
      color: var(--nf-text-secondary-alt);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .nf-password-toggle:hover {
      color: var(--nf-text);
    }

    .nf-eye-closed {
      display: none;
    }

    .nf-password-visible .nf-eye-open {
      display: none;
    }

    .nf-password-visible .nf-eye-closed {
      display: block;
    }

    .nf-field-error {
      display: block;
      margin: -0.5rem 0 0.75rem;
      font-size: 0.875rem;
      color: var(--nf-error);
    }

    .nf-forgot {
      margin-bottom: 1rem;
    }

    .nf-forgot span {
      display: inline-flex;
      padding: 0.25rem;
      font-size: 0.875rem;
      color: var(--nf-text-secondary-alt);
    }

    .nf-forgot a {
      display: inline-flex;
      padding: 0.25rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--nf-accent);
      text-decoration: underline;
      text-decoration-color: transparent;
      transition: all 0.2s;
    }

    .nf-forgot a:hover {
      color: var(--nf-accent-hover);
      text-decoration-color: var(--nf-accent-hover);
    }

    .nf-checkbox-field {
      margin-bottom: 1rem;
    }

    .nf-checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: var(--nf-text-secondary);
      cursor: pointer;
    }

    .nf-checkbox-label input[type='checkbox'] {
      width: 1.125rem;
      height: 1.125rem;
      accent-color: var(--nf-accent);
      cursor: pointer;
    }

    .nf-submit {
      margin-top: 1.5rem;
    }

    .nf-submit-row {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .nf-submit-row .nf-button {
      flex: 1;
    }

    .nf-button {
      width: 100%;
      height: 3rem;
      border-radius: 1rem;
      border: none;
      background: var(--nf-accent);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }

    .nf-button:hover {
      background: var(--nf-accent-hover);
    }

    .nf-button-secondary {
      background: transparent;
      border: 1px solid var(--nf-border);
      color: var(--nf-text);
    }

    .nf-button-secondary:hover {
      background: rgba(66, 66, 66, 0.06);
      border-color: var(--nf-text-secondary-alt);
    }

    .nf-instruction {
      margin: 0 0 1.5rem;
      text-align: center;
      font-size: 0.9375rem;
      line-height: 1.5;
      color: var(--nf-text-secondary);
    }

    .nf-instruction a {
      color: var(--nf-accent);
      font-weight: 500;
      text-decoration: underline;
      text-decoration-color: transparent;
      transition: all 0.2s;
    }

    .nf-instruction a:hover {
      color: var(--nf-accent-hover);
      text-decoration-color: var(--nf-accent-hover);
    }

    .nf-trace-id {
      margin: 0 0 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--nf-text-secondary-alt);
      word-break: break-all;
    }

    .nf-info {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.875rem;
      color: var(--nf-text-secondary);
    }

    .nf-back-link {
      margin-top: 1rem;
      text-align: center;
    }

    .nf-back-link a {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--nf-accent);
      text-decoration: none;
    }

    .nf-back-link a:hover {
      color: var(--nf-accent-hover);
      text-decoration: underline;
    }
  login.ftl: |
    <#import "template.ftl" as layout>
    <@layout.registrationLayout displayMessage=!messagesPerField.existsError('username','password'); section>
        <#if section = "header">
            ${msg("loginAccountTitle")}
        <#elseif section = "form">
            <form id="kc-form-login" class="nf-form" onsubmit="login.disabled = true; return true;" action="${url.loginAction}" method="post">
                <div class="nf-field">
                    <input tabindex="1" id="username" class="nf-input" name="username" value="${(login.username!'')}" type="text"
                           <#if !(login.username!'')?has_content>autofocus</#if> autocomplete="<#if usernameHidden??>off<#else>email</#if>"
                           aria-invalid="<#if messagesPerField.existsError('username','password')>true</#if>"
                           placeholder=" " />
                    <label for="username" class="nf-label">
                        <#if !realm.loginWithEmailAllowed>${msg("username")}<#elseif !realm.registrationEmailAsUsername>${msg("usernameOrEmail")}<#else>${msg("email")}</#if>
                    </label>
                </div>

                <div class="nf-field nf-field-password">
                    <input tabindex="2" id="password" class="nf-input" name="password" type="password" autocomplete="current-password" placeholder=" "
                           <#if (login.username!'')?has_content>autofocus</#if>
                           aria-invalid="<#if messagesPerField.existsError('username','password')>true</#if>" />
                    <label for="password" class="nf-label">${msg("password")}</label>
                    <button type="button" class="nf-password-toggle" aria-label="${msg("showPassword")!'Show password'}" onclick="nfTogglePassword(this)">
                        <svg class="nf-eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="nf-eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>

                <#if messagesPerField.existsError('username','password')>
                    <span class="nf-field-error">${kcSanitize(messagesPerField.getFirstError('username','password'))?no_esc}</span>
                </#if>

                <div class="nf-forgot">
                    <#if realm.resetPasswordAllowed>
                        <a tabindex="5" href="${url.loginResetCredentialsUrl}">${msg("doForgotPassword")}</a>
                    <#else>
                        <span>${msg("forgotPasswordContactAdmin")}</span>
                    </#if>
                </div>

                <div class="nf-submit">
                    <#if realm.rememberMe>
                        <input type="hidden" name="rememberMe" value="on"/>
                    </#if>
                    <input type="hidden" id="id-hidden-input" name="credentialId" value="<#if auth?has_content>${auth.selectedCredential!}</#if>"/>
                    <input tabindex="4" class="nf-button" name="login" id="kc-login" type="submit" value="${msg("doLogIn")}"/>
                </div>
            </form>
        </#if>
    </@layout.registrationLayout>
  login.js: |
    function nfTogglePassword(btn) {
      var wrapper = btn.closest('.nf-field-password');
      var input = wrapper.querySelector('input');
      var isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      wrapper.classList.toggle('nf-password-visible', isPassword);
    }
  logo.svg: |
    <svg xmlns="http://www.w3.org/2000/svg" width="194" height="53" viewBox="0 0 194 53" fill="none" role="img" aria-label="Corporate">
    <defs><linearGradient id="corporate-logo" x1="39" y1="15.5" x2="17" y2="37.5" gradientUnits="userSpaceOnUse"><stop stop-color="#34D3B5"/><stop offset="1" stop-color="#3B82F6"/></linearGradient></defs>
    <rect width="194" height="53" rx="12" fill="#0B1B33"/>
    <path d="M36.43 19.43 A11 11 0 1 0 36.43 33.57" stroke="url(#corporate-logo)" stroke-width="5.5" stroke-linecap="round" fill="none"/><circle cx="38.45" cy="26.5" r="3.0250000000000004" fill="url(#corporate-logo)"/>
