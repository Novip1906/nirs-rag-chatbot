  template.ftl: |
    <#macro registrationLayout bodyClass="" displayInfo=false displayMessage=true displayRequiredFields=false displayWide=false showAnotherWayIfPresent=true>
    <!DOCTYPE html>
    <html<#if realm.internationalizationEnabled> lang="${locale.currentLanguageTag}"</#if>>

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <meta name="robots" content="noindex, nofollow">
        <#assign nfPageTitle><#nested "title"></#assign>
        <title><#if nfPageTitle?has_content>${nfPageTitle}<#else>${msg("loginTitle",(realm.displayName!''))}</#if></title>
        <#if properties.styles?has_content>
            <#list properties.styles?split(' ') as style>
                <link href="${url.resourcesPath}/${style}" rel="stylesheet" />
            </#list>
        </#if>
        <#if properties.scripts?has_content>
            <#list properties.scripts?split(' ') as script>
                <script src="${url.resourcesPath}/${script}" type="text/javascript"></script>
            </#list>
        </#if>
        <script type="module">
            <#outputformat "JavaScript">
            import { startSessionPolling } from ${(url.resourcesPath + "/js/authChecker.js")?c};

            startSessionPolling(
                ${url.ssoLoginInOtherTabsUrl?c}
            );
            </#outputformat>
        </script>
        <#if authenticationSession??>
            <script type="module">
                <#outputformat "JavaScript">
                import { checkAuthSession } from ${(url.resourcesPath + "/js/authChecker.js")?c};

                checkAuthSession(
                    ${authenticationSession.authSessionIdHash?c}
                );
                </#outputformat>
            </script>
        </#if>
    </head>

    <body class="nf-body">
        <div class="nf-page">
            <div class="nf-logo">
                <img src="${url.resourcesPath}/img/logo.svg" alt="Corporate AI" />
            </div>
            <main class="nf-main">
                <div class="nf-card">
                    <h1 class="nf-title"><#nested "header"></h1>
                    <#if displayMessage && message?has_content && (message.type != 'warning' || !isAppInitiatedAction??)>
                        <div class="nf-alert nf-alert-${message.type}">
                            <span>${kcSanitize(message.summary)?no_esc}</span>
                        </div>
                    </#if>
                    <#nested "form">
                    <#if displayInfo>
                        <div class="nf-info"><#nested "info"></div>
                    </#if>
                </div>
            </main>
        </div>
    </body>
    </html>
    </#macro>
