kind: ConfigMap
metadata:
  name: keycloak-theme-corporate-email
  namespace: corporate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: corporate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      initContainers:
        - name: wait-for-keycloak-db
          image: postgres:16.15-alpine3.24
          command:
            - sh
            - -c
            - until pg_isready -h keycloak-db -p 5432 -U keycloak; do sleep 2; done
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.2
          args: ["start"]
          env:
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://keycloak-db:5432/keycloak"
            - name: KC_DB_USERNAME
              value: "keycloak"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: password
            - name: KC_HOSTNAME
              value: "https://auth.example.com"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
          ports:
            - containerPort: 8080
            - containerPort: 9000
          resources:
            requests:
              memory: "400Mi"
              cpu: "100m"
            limits:
              memory: "700Mi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: theme-corporate
              mountPath: /opt/keycloak/themes/corporate/login
              readOnly: true
            - name: theme-corporate-email
              mountPath: /opt/keycloak/themes/corporate/email
              readOnly: true
      volumes:
        - name: theme-corporate
          configMap:
            name: keycloak-theme-corporate
            items:
              - key: error.ftl
                path: error.ftl
              - key: info.ftl
                path: info.ftl
              - key: login-page-expired.ftl
