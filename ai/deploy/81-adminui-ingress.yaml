apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adminui
  namespace: corporate
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - admin.example.com
      secretName: adminui-tls
  rules:
    - host: admin.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adminui
                port:
                  number: 80
